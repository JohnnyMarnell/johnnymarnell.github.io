<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carousel</title>
<!--
  The whole approach in one self-contained page. No debug output.

  The rule that shapes it: nothing is drawn on top of the video. YouTube's own
  expand control is the only thing that can reach real fullscreen on an iPhone
  (it calls webkitEnterFullscreen on its own <video>, which we cannot do across
  origins), and it lives in the player's bottom-right. Any transparent sheet
  over the player to catch swipes, or any arrow floating over the frame, also
  swallows the tap meant for that control. So the arrows and the thumbnails sit
  in a footer, below the video, where they cannot intercept anything.

  Autoplay is muted because that is the only autoplay iOS permits; sound is one
  tap, over postMessage, so no API script is needed.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 48px; background: #0d0d10; color: #e8e8ea;
    font: 16px/1.55 system-ui, -apple-system, sans-serif;
    max-width: 860px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { margin: 0 0 20px; color: #8a8a94; font-size: 14px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    position: relative; display: block; padding: 0; border: 0; overflow: hidden;
    border-radius: 10px; background: #000; cursor: pointer; width: 100%;
    aspect-ratio: 16 / 9; -webkit-tap-highlight-color: transparent;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile::after { content: ""; position: absolute; inset: 0;
                 background: radial-gradient(circle, rgb(0 0 0 / 10%), rgb(0 0 0 / 45%)); }
  .tile svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
              width: clamp(40px, 22%, 60px); z-index: 1;
              filter: drop-shadow(0 2px 12px rgb(0 0 0 / 70%)); }

  /* ---------------------------------------------------------- lightbox --- */
  .box { position: fixed; inset: 0; z-index: 50; display: none;
         grid-template-rows: auto 1fr auto; background: #070709; }
  .box.open { display: grid; }
  body.locked { overflow: hidden; }

  .head { display: flex; align-items: center; justify-content: space-between;
          gap: 10px; padding: max(8px, env(safe-area-inset-top)) 12px 8px; }
  .title { font-size: 14px; color: #a8a8b2; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }

  /* The video. Container units, so it fits whatever the header and footer
     leave behind without hard-coding their heights. */
  .stage { container-type: size; display: grid; place-items: center;
           min-height: 0; padding: 0 8px; }
  .frame { aspect-ratio: var(--a, 16 / 9);
           width: min(100cqw, calc(100cqh * var(--a, 16 / 9)));
           max-width: 100cqw; max-height: 100cqh;
           background: #000; border-radius: 8px; overflow: hidden; }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }

  .foot { display: flex; align-items: center; gap: 10px;
          padding: 10px 12px max(10px, env(safe-area-inset-bottom));
          border-top: 1px solid #1e1e26; background: #101014; }
  .rail { flex: 1; display: flex; gap: 8px; justify-content: center;
          overflow-x: auto; }
  .rail button {
    flex: 0 0 auto; height: 46px; width: auto; aspect-ratio: var(--ta, 16 / 9);
    padding: 0; border: 0; border-radius: 5px; overflow: hidden; background: #000;
    opacity: .45; outline: 2px solid transparent; outline-offset: 1px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .rail button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rail button[aria-current="true"] { opacity: 1; outline-color: #63c0f5; }

  .btn { flex: 0 0 auto; display: grid; place-items: center;
         min-width: 52px; min-height: 52px; padding: 0;
         border: 1px solid #33333d; border-radius: 10px; background: #1b1b22;
         color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn:active { background: #2a2a34; }
  .btn svg { width: 22px; height: 22px; }
  .btn.sound { min-width: 44px; min-height: 44px; font-size: 17px; }
  .btn.close { min-width: 44px; min-height: 44px; }
</style>
</head>
<body>

<h1>Carousel</h1>
<p class="sub">Tap a thumbnail. It should autoplay, the arrows and thumbnails below
should move between the two, and the expand control in the player's bottom-right
should go properly fullscreen.</p>

<div class="grid" id="grid"></div>

<div class="box" id="box" role="dialog" aria-modal="true" aria-label="Video">
  <div class="head">
    <span class="title" id="caption"></span>
    <button class="btn close" id="close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="stage"><div class="frame" id="frame"></div></div>

  <div class="foot">
    <button class="btn" id="prev" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="rail" id="rail"></div>
    <button class="btn sound" id="sound" aria-label="Sound on">🔇</button>
    <button class="btn" id="next" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ITEMS = [
    { id: "n92QxOXHpaI", a: "16 / 9", title: "Pixelblaze over ArtNet" },
    { id: "Kg0VKvDbvkU", a: "9 / 16", title: "Raspberry Pi guitar" }
  ];
  var poster = function (id) { return "https://i.ytimg.com/vi/" + id + "/maxresdefault.jpg"; };

  var grid = document.getElementById("grid"), box = document.getElementById("box");
  var frame = document.getElementById("frame"), rail = document.getElementById("rail");
  var caption = document.getElementById("caption"), sound = document.getElementById("sound");
  var PLAY = '<svg viewBox="0 0 68 48" aria-hidden="true"><path fill="#f00" d="M66.5 7.7a8 8 0 0 0-5.6-5.7C55.8.6 34 .6 34 .6s-21.8 0-26.9 1.4a8 8 0 0 0-5.6 5.7A84 84 0 0 0 .1 24a84 84 0 0 0 1.4 16.3 8 8 0 0 0 5.6 5.6C12.2 47.4 34 47.4 34 47.4s21.8 0 26.9-1.5a8 8 0 0 0 5.6-5.6A84 84 0 0 0 68 24a84 84 0 0 0-1.5-16.3z"/><path fill="#fff" d="M45 24 27 14v20z"/></svg>';
  var index = -1;

  ITEMS.forEach(function (it, i) {
    var b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = '<img src="' + poster(it.id) + '" alt="">' + PLAY;
    b.addEventListener("click", function () { open(i); });
    grid.appendChild(b);

    var t = document.createElement("button");
    t.style.setProperty("--ta", it.a);
    t.innerHTML = '<img src="' + poster(it.id) + '" alt="">';
    t.setAttribute("aria-label", it.title);
    t.addEventListener("click", function () { show(i); });
    rail.appendChild(t);
  });
  var thumbs = [].slice.call(rail.children);

  function show(i) {
    index = (i + ITEMS.length) % ITEMS.length;
    var it = ITEMS[index];
    frame.style.setProperty("--a", it.a);
    caption.textContent = it.title;

    // mute=1 buys the autoplay; playsinline=1 keeps it on the page;
    // fs=1 leaves YouTube's expand control on screen, which is the fullscreen.
    var p = new URLSearchParams({
      autoplay: "1", mute: "1", playsinline: "1", fs: "1", rel: "0",
      enablejsapi: "1", origin: location.origin
    });
    frame.innerHTML =
      '<iframe src="https://www.youtube.com/embed/' + it.id + "?" + p + '"' +
      ' title="' + it.title + '" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"' +
      ' allowfullscreen webkitallowfullscreen></iframe>';

    sound.textContent = "🔇";
    thumbs.forEach(function (t, n) {
      if (n === index) t.setAttribute("aria-current", "true"); else t.removeAttribute("aria-current");
    });
  }

  function open(i) { box.classList.add("open"); document.body.classList.add("locked"); show(i); }
  function close() {
    box.classList.remove("open"); document.body.classList.remove("locked");
    frame.innerHTML = ""; index = -1;
  }

  document.getElementById("prev").addEventListener("click", function () { show(index - 1); });
  document.getElementById("next").addEventListener("click", function () { show(index + 1); });
  document.getElementById("close").addEventListener("click", close);

  sound.addEventListener("click", function () {
    var f = frame.querySelector("iframe");
    if (!f) return;
    f.contentWindow.postMessage(JSON.stringify({ event: "command", func: "unMute", args: [] }), "*");
    f.contentWindow.postMessage(JSON.stringify({ event: "command", func: "setVolume", args: [100] }), "*");
    sound.textContent = "🔊";
  });

  document.addEventListener("keydown", function (e) {
    if (!box.classList.contains("open")) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowRight") show(index + 1);
    else if (e.key === "ArrowLeft") show(index - 1);
  });
})();
</script>
</body>
</html>
