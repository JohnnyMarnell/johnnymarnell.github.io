name: tests

# Manual only. The Playwright suite installs Ruby, Node, gems, npm deps and a
# Chromium build before it can assert anything — several minutes on every push,
# for a static site that GitHub Pages deploys straight from `main` regardless.
# It is a local tool (`just test`), not a gate: run it from the Actions tab when
# you actually want it.
on:
  workflow_dispatch:

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The webServer (tests/helpers/serve.mjs) runs `jekyll build` before it
      # listens, so the specs assert on real Liquid output, not a fixture.
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
