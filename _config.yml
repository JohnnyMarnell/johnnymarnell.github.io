# Site settings
title: johnny-marnell
description: all things music and tech
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://johnnymarnell.github.io" # the base hostname & protocol for your site

# Theme selection - uncomment the theme you want to use
# GitHub Pages supported themes:
#theme: minima
# theme: jekyll-theme-cayman
# theme: jekyll-theme-slate
# theme: jekyll-theme-merlot
# theme: jekyll-theme-time-machine
# theme: jekyll-theme-minimal
# theme: jekyll-theme-leap-day
# theme: jekyll-theme-modernist
theme: jekyll-theme-hacker
# theme: jekyll-theme-midnight

# theme: jekyll-theme-arschitect
# theme: jekyll-theme-tactile
# theme: jekyll-theme-dinky

# Remote themes (also supported by GitHub Pages)
# remote_theme: pages-themes/cayman@v0.2.0
# remote_theme: pages-themes/minimal@v0.2.0

# Hacker theme config - hide GitHub button
show_downloads: false
github:
  is_project_page: false

# Build settings
plugins:
  - jekyll-feed
  - jekyll-remote-theme # Required for remote themes
  - jekyll-redirect-from # For handling legacy URLs

# Exclude from processing
# Without these, Jekyll copies the dev tooling straight into _site/ and
# GitHub Pages publishes it — `curl https://johnnymarnell.github.io/package.json`
# used to work for justfile/Dockerfile, and the test suite would have joined them.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .bundle/
  - package.json
  - package-lock.json
  - playwright.config.js
  - playwright-report/
  - test-results/
  - tests/
  - justfile
  - Dockerfile
  - docker-compose.yaml
  - CLAUDE.md
# NOT README.md — there is no root index.*, so README.md *is* the homepage.