---
layout: default
---
<style>
    .gallery, .masonry-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        grid-auto-rows: 150px;
        gap: 20px;
        margin-top: 30px;
    }

    @media (min-width: 768px) {
        .gallery, .masonry-container {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 180px;
        }
    }

    @media (min-width: 1024px) {
        .gallery, .masonry-container {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            grid-auto-rows: 200px;
        }
    }

    /* Horizontal videos and images span 1 row */
    .video-thumbnail, .image-item {
        grid-row: span 1;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .video-thumbnail {
        position: relative;
        display: block;
        overflow: hidden;
    }
    
    /* Vertical videos span 2 rows but need container */
    .vertical-video {
        grid-row: span 2;
        position: relative;
        overflow: hidden;
        border-radius: 4px;
    }

    .vertical-video .video-thumbnail {
        width: 100%;
        height: 100%;
        border: none; /* Remove double border */
    }

    /* For vertical videos, crop the YouTube thumbnail */
    .vertical-video .video-thumbnail img {
        position: absolute;
        width: 178%; /* 16/9 to fill 9/16 */
        height: auto;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-height: 100%;
    }

    /* Normal horizontal video thumbnails */
    .video-thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .video-thumbnail .play-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 3em;
        color: var(--link-color, #63c0f5);
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        transition: transform 0.2s;
        z-index: 1;
    }

    .video-thumbnail:hover .play-icon {
        transform: translate(-50%, -50%) scale(1.2);
    }

    @media (max-width: 767px) {
        .gallery, .masonry-container {
            grid-template-columns: 1fr;
            grid-auto-rows: 200px;
        }
        
        /* On mobile, letterbox vertical videos to 1 row */
        .vertical-video {
            grid-row: span 1; /* Same height as horizontal videos */
        }
        
        /* Reset the cropping - show full thumbnail letterboxed */
        .vertical-video .video-thumbnail img {
            position: static;
            width: 100%;
            height: 100%;
            transform: none;
            object-fit: contain; /* Letterbox */
            background: black; /* Black bars */
        }
    }

    /* Theme-aware styles */
    h1, h2, h3 {
        /* These will inherit from the theme automatically */
    }

    a.video-thumbnail:hover {
        /* Use theme's link hover behavior */
        text-decoration: none;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
<script>
    // Set theme-aware color for play icons
    document.addEventListener('DOMContentLoaded', function() {
        // Try to detect theme's primary color from existing links
        const link = document.querySelector('a');
        if (link) {
            const linkStyle = window.getComputedStyle(link);
            const linkColor = linkStyle.color;
            document.documentElement.style.setProperty('--link-color', linkColor);
        }
        
        // Auto-detect vertical videos using YouTube oEmbed API
        document.querySelectorAll('.video-thumbnail[data-youtube-id]').forEach(async (element) => {
            const videoId = element.dataset.youtubeId;
            try {
                // Using noembed.com as a CORS-friendly proxy for YouTube oEmbed
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                const data = await response.json();
                
                if (data.height > data.width) {
                    // It's vertical! Update the element
                    element.classList.add('video-thumbnail-vertical');
                    element.dataset.width = "640";
                    element.dataset.height = "1138";
                    
                    // Wrap in vertical-video div if not already wrapped
                    if (!element.parentElement.classList.contains('vertical-video')) {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'vertical-video';
                        element.parentElement.insertBefore(wrapper, element);
                        wrapper.appendChild(element);
                    }
                }
            } catch (e) {
                console.log('Could not fetch video metadata for', videoId);
            }
        });
    });

    Fancybox.bind("[data-fancybox]", {
        Hash: false,
        closeExisting: true,
        infinite: true
    });
</script>
