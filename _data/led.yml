# The /led gallery: its items, in the order they are shown.
#
# This lives in data rather than as inline `{% include %}` calls in led.md
# because two things have to walk the same list: the page itself
# (_includes/led-body.md) and `just share`, which generates one share page per
# item so a link pasted into WhatsApp or iMessage previews *that* item. A
# crawler reads og: tags out of server-rendered HTML and never runs JS, and
# GitHub Pages serves byte-identical HTML for every query string — so a
# per-item preview needs a per-item path, and a per-item path needs this list
# to be machine-readable.
#
# Image paths are written out in full rather than relying on the `image`
# include's fuzzy match against /img/*, so the generator resolves the same file
# the page does without reimplementing that search.
#
# After editing: `just share` (regenerates share/) and `just media` (orientation
# and dimensions). tests/led-share.spec.js fails if either is stale.

share:
  # The subtitle under the item's caption in a link preview. The caption is the
  # title, so this says where the thing is from rather than repeating it.
  description: >-
    A 10,000-pixel LED ceiling built for Burning Man — Chromatik patterns,
    beat detection in Librosa, and a Raspberry Pi driving the lot.

